    <script>
      tailwind.config = {
        darkMode: 'class', // Changed to 'class' for manual toggle
        theme: {
          extend: {
            colors: {
              background: 'var(--color-background)',
              surface: 'var(--color-surface)',
              primary: 'var(--color-primary)',
              success: 'var(--color-success)',
              warning: 'var(--color-warning)',
              error: 'var(--color-error)',
              textPrimary: 'var(--color-text-primary)',
              textSecondary: 'var(--color-text-secondary)',
              // Aliases for compatibility
              'bg-base': 'var(--color-background)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --color-background: #F8FAFC;
        --color-surface: #FFFFFF;
        --color-primary: #2563EB;
        --color-success: #22C55E;
        --color-warning: #F59E0B;
        --color-error: #EF4444;
        --color-text-primary: #0F172A;
        --color-text-secondary: #334155;
      }

      /* Dark mode overrides applied when the 'dark' class is present on html */
      html.dark {
        --color-background: #020617;
        --color-surface: #0F172A;
        --color-primary: #3B82F6;
        --color-success: #22C55E;
        --color-warning: #F59E0B;
        --color-error: #EF4444;
        --color-text-primary: #E5E7EB;
        --color-text-secondary: #94A3B8;
      }

      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: var(--color-background);
        color: var(--color-text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* --- UI Polish & Smooth Transitions --- */
      button, a {
        transition: all 0.2s ease-in-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }

      @keyframes typingBounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
        30% { transform: translateY(-6px); opacity: 1; }
      }
      .typing-dot {
        animation: typingBounce 1.2s ease-in-out infinite;
      }

      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--color-text-secondary); border-radius: 4px; opacity: 0.4; }
      ::-webkit-scrollbar-thumb:hover { opacity: 0.7; }

      select option { background-color: var(--color-surface); color: var(--color-text-primary); }
    </style>
